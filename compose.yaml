name: ${COMPOSE_PROJECT_NAME:-ab4irerp}

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-AB4IRERP}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_STACK: ${LOG_STACK:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RELEASE_SHA: ${RELEASE_SHA:-unknown}
  DEPLOYED_AT: ${DEPLOYED_AT:-unknown}
  APP_RUNTIME_IMAGE_REF: ${APP_RUNTIME_IMAGE:-ghcr.io/mabonax/ab4ir_erp-app:latest}
  WEB_RUNTIME_IMAGE_REF: ${WEB_RUNTIME_IMAGE:-ghcr.io/mabonax/ab4ir_erp-web:latest}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-ab4irerp}
  DB_USERNAME: ${DB_USERNAME:-ab4irerp}
  DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
  CACHE_STORE: ${CACHE_STORE:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
  RUN_ACCESS_CONTROL_RESYNC: ${RUN_ACCESS_CONTROL_RESYNC:-false}
  RUN_OPTIMIZE_ON_BOOT: ${RUN_OPTIMIZE_ON_BOOT:-false}
  APP_VALIDATE_ENV_ON_BOOT: ${APP_VALIDATE_ENV_ON_BOOT:-true}
  WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
  WAIT_FOR_REDIS: ${WAIT_FOR_REDIS:-true}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-60}
  REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-60}
  QUEUE_WORKER_TRIES: ${QUEUE_WORKER_TRIES:-3}
  QUEUE_WORKER_SLEEP: ${QUEUE_WORKER_SLEEP:-3}
  QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT:-120}
  QUEUE_WORKER_MAX_TIME: ${QUEUE_WORKER_MAX_TIME:-3600}
  QUEUE_WORKER_QUEUES: ${QUEUE_WORKER_QUEUES:-default}
  SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60}
  SCHEDULER_HEARTBEAT_TTL: ${SCHEDULER_HEARTBEAT_TTL:-180}

x-app-service: &app-service
  image: ${APP_RUNTIME_IMAGE:-ghcr.io/mabonax/ab4ir_erp-app:latest}
  build:
    context: .
    target: app
  env_file:
    - ${APP_ENV_FILE:-.env}
  restart: unless-stopped
  init: true
  stop_grace_period: 90s
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: *app-environment
  volumes:
    - app-storage:/var/www/html/storage
  networks:
    - internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *app-service
    healthcheck:
      test: ["CMD", "healthcheck-app"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${WEB_RUNTIME_IMAGE:-ghcr.io/mabonax/ab4ir_erp-web:latest}
    build:
      context: .
      target: web
    env_file:
      - ${APP_ENV_FILE:-.env}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-storage:/var/www/html/storage:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    <<: *app-service
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      RUN_ACCESS_CONTROL_RESYNC: "false"
      RUN_OPTIMIZE_ON_BOOT: "false"
    command: ["start-worker"]
    healthcheck:
      test: ["CMD", "healthcheck-worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app-service
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      RUN_ACCESS_CONTROL_RESYNC: "false"
      RUN_OPTIMIZE_ON_BOOT: "false"
    command: ["start-scheduler"]
    healthcheck:
      test: ["CMD", "healthcheck-scheduler"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    <<: *app-service
    profiles: ["ops"]
    restart: "no"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      RUN_ACCESS_CONTROL_RESYNC: "false"
      RUN_OPTIMIZE_ON_BOOT: "false"
    command: ["php", "artisan", "system:backup-database", "--prune"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ab4irerp}
      MYSQL_USER: ${DB_USERNAME:-ab4irerp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ] && [ \"$$REDIS_PASSWORD\" != \"null\" ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -Eq 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    driver: bridge

volumes:
  app-storage:
  mysql-data:
  redis-data:
