name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application environment
        run: |
          cp .env.example .env
          mkdir -p database bootstrap/cache
          touch database/database.sqlite
          {
            echo "APP_NAME=AB4IRERP"
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "APP_URL=http://localhost"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite"
            echo "CACHE_STORE=array"
            echo "QUEUE_CONNECTION=sync"
            echo "SESSION_DRIVER=array"
            echo "MAIL_MAILER=log"
          } >> .env

          php artisan key:generate --force
          php artisan config:clear

      - name: Run deployment validation
        run: php artisan system:validate-deployment

      - name: Run backend checks
        run: composer test

      - name: Run frontend checks
        run: |
          npm run format:check
          npm run lint
          npm run types
          npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy deploy environment
        run: |
          cp .env.example .env
          {
            echo "APP_NAME=AB4IRERP"
            echo "APP_KEY=base64:ci-only-placeholder-ci-only-placeholder"
          } >> .env

      - name: Validate compose configuration
        run: docker compose config

      - name: Build runtime images
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: ghcr.io/mabonax/ab4ir_erp-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          tags: ghcr.io/mabonax/ab4ir_erp-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
